<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Motor de Fractales</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { display: flex; height: 100vh; background: #0a0a0a; color: #eee; font-family: sans-serif; }
    #panel { width: 300px; background: rgba(20,20,30,0.95); padding: 20px; overflow-y: auto; }
    #canvas-container { flex: 1; background: #000; }
    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
    button, select, input { width: 100%; padding: 8px; margin: 8px 0; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: #fff; }
    label { display: block; margin: 10px 0 4px; font-size: 12px; }
    h2 { color: #0ff; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div id="panel">
    <button id="langBtn">English</button>
    <h2>Motor de Fractales</h2>
    <label>Tipo de Fractal</label>
    <select id="fractalType">
      <option value="mandelbrot">Mandelbrot</option>
      <option value="julia">Julia</option>
      <option value="burningship">Burning Ship</option>
      <option value="tricorn">Tricorn</option>
      <option value="celtic">Celtic</option>
      <option value="buffalo">Buffalo</option>
    </select>
    <label>Iteraciones: <span id="iterVal">100</span></label>
    <input type="range" id="maxIter" min="50" max="2000" value="100">
    <label>Zoom: <span id="zoomVal">1</span></label>
    <input type="range" id="zoom" min="1" max="1000" value="1">
    <label>Paleta</label>
    <select id="palette">
      <option value="fuego">Fuego</option>
      <option value="hielo">Hielo</option>
      <option value="neon">Neón</option>
    </select>
  </div>
  <div id="canvas-container">
    <canvas id="fractalCanvas"></canvas>
  </div>
  <script src="fractals.js"></script>
</body>
</html>
