<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-key="title">Motor de Fractales</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      height: 100vh;
      width: 100vw;
      background: #000;
      color: #eee;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }
    #panel {
      width: 300px;
      flex-shrink: 0;
      background: rgba(20, 20, 30, 0.95);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px;
      overflow-y: auto;
      color: #fff;
    }
    #canvas-container {
      flex: 1;
      position: relative;
      min-width: 0;
      min-height: 0;
      background: #0a0a0a;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      cursor: crosshair;
    }
    #langBtn {
      width: 100%;
      margin-bottom: 16px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    #langBtn:hover { background: rgba(255, 255, 255, 0.2); }
    h2 { margin: 0 0 20px; font-weight: 300; letter-spacing: 1px; color: #0ff; font-size: 18px; }
    label { display: block; margin: 14px 0 6px; font-size: 12px; opacity: 0.8; text-transform: uppercase; letter-spacing: 0.5px; }
    
    /* ARREGLO CRÍTICO: Fondo oscuro y texto blanco explícito para selectores */
    select, input[type=text] {
      width: 100%;
      padding: 8px;
      margin: 4px 0 12px 0;
      background: #000;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      font-size: 13px;
    }
    option {
      background: #000;
      color: #ffffff;
    }
    input[type=range] { width: 100%; margin: 4px 0 12px 0; }
    .val { float: right; color: #0ff; font-family: monospace; }
    
    #renderBtn {
      width: 100%;
      margin-top: 16px;
      padding: 10px;
      background: linear-gradient(135deg, #0ff, #08f);
      border: none;
      border-radius: 6px;
      color: #000;
      font-weight: 600;
      cursor: pointer;
    }
    #renderBtn:hover { opacity: 0.9; }
    a { display: block; margin-top: 16px; color: #0ff; text-decoration: none; font-size: 11px; text-align: center; opacity: 0.7; }
    a:hover { opacity: 1; }
  </style>
<link rel="stylesheet" href="ui-overlay.css">
</head>
<body>
  <div id="panel">
    <button id="langBtn" data-key="lang">English</button>
    <h2 data-key="title">Motor de Fractales</h2>
    
    <label data-key="type">Tipo de Fractal</label>
    <select id="fractalType">
      <option value="mandelbrot" data-key="mandelbrot">Mandelbrot</option>
      <option value="julia" data-key="julia">Julia</option>
      <option value="burningship" data-key="burning">Burning Ship</option>
      <option value="tricorn" data-key="tricorn">Tricorn</option>
      <option value="celtic" data-key="celtic">Celtic</option>
      <option value="buffalo" data-key="buffalo">Buffalo</option>
      <option value="multibrot3" data-key="multibrot3">Multibrot z^3</option>
      <option value="multibrot4" data-key="multibrot4">Multibrot z^4</option>
      <option value="phoenix" data-key="phoenix">Phoenix</option>
    </select>

    <label data-key="iter">Iteraciones <span class="val" id="iterVal">100</span></label>
    <input type="range" id="maxIter" min="50" max="2000" value="100">

    <label data-key="zoom">Nivel de Zoom <span class="val" id="zoomVal">1</span></label>
    <input type="range" id="zoom" min="1" max="100" step="1" value="1">

    <label data-key="palette">Paleta</label>
    <select id="palette">
      <option value="fuego">Fuego</option>
      <option value="hielo">Hielo</option>
      <option value="neon">Neón</option>
      <option value="oceano">Océano</option>
      <option value="bosque">Bosque</option>
      <option value="academico">Académico</option>
    </select>

    <button id="renderBtn" data-key="render">Renderizar</button>
    <a href="https://github.com/amurlaniakea/fractal" target="_blank" data-key="source">Código Fuente (AGPL-3.0)</a>
  </div>

  <div id="canvas-container">
    <canvas id="fractalCanvas"></canvas>
  </div>

  <script src="fractals.js"></script>
</body>
</html>
